[project]
name = "desafio-trauma-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.66,<3",
  "openpyxl>=3.1,<4",
  "playwright>=1.50,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "supabase>=2.13,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["../tests/pipeline"]
